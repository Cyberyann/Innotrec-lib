{% extends "innotrec_auth/email/base.html" %}
{% block content %}
<p>Hello {{ user.first_name|default:user.email }},</p>
<p>Your verification code is:</p>
<p style="font-size:32px;letter-spacing:8px;font-weight:700;text-align:center;margin:24px 0;font-family:Consolas,monospace;">{{ code }}</p>
<p>It expires in {{ ttl_minutes }} minutes. Never share this code with anyone.</p>
{% endblock %}
