[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "innotrec-auth"
dynamic = ["version"]
description = "Shared Django REST Framework user & authentication library (users, login, 2FA, password reset, CSRF, mail templates)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Innotrec" }]
dependencies = [
  "Django>=6.1,<7",
  "djangorestframework>=3.18,<4",
  "django-cors-headers>=4.9",
  "pyotp>=2.12",
  "qrcode>=8.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.2",
  "pytest-django>=4.14",
  "pytest-cov>=7.1",
  "black>=26.10",
  "ruff>=0.17",
  "mypy>=2.4",
  "django-stubs[compatible-mypy]>=6.1",
  "djangorestframework-stubs[compatible-mypy]>=3.18",
]

[tool.hatch.version]
path = "innotrec_auth/__init__.py"
pattern = "__version__: str = \"(?P<version>[^\"]+)\""

[tool.hatch.build.targets.wheel]
packages = ["innotrec_auth"]

[tool.hatch.build.targets.sdist]
include = ["innotrec_auth", "README.md", "CHANGELOG.md"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "S", "DJ"]
ignore = ["ANN401", "S101", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"innotrec_auth/migrations/*" = ["ALL"]
"innotrec_auth/tests/*" = ["S", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["qrcode.*", "pyotp.*", "corsheaders.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "innotrec_auth.tests.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "innotrec_auth.tests.settings"
testpaths = ["innotrec_auth/tests"]
addopts = "-ra --strict-markers"
markers = ["e2e: end-to-end API scenarios (full user journeys)"]
