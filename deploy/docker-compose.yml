# Full stack: nginx proxy -> (React SPA, documentation, Django/gunicorn) -> PostgreSQL + Redis
#
#   cp deploy/.env.example deploy/.env       # then edit the secrets
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml --profile dev up -d --build   # + Mailpit (fake SMTP)
name: innotrec

x-backend-env: &backend-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in deploy/.env}
  DJANGO_DEBUG: 'false'
  DJANGO_ALLOWED_HOSTS: ${DOMAIN:-localhost},localhost,backend
  APP_NAME: ${APP_NAME:-Innotrec Sample}
  SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
  DATABASE_URL: postgres://${POSTGRES_USER:-innotrec}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-innotrec}
  REDIS_URL: redis://redis:6379/0
  FRONTEND_URL: ${PUBLIC_URL:-http://localhost:8080}
  FRONTEND_ORIGINS: ${PUBLIC_URL:-http://localhost:8080}
  SECURE_COOKIES: ${SECURE_COOKIES:-false}
  NUM_PROXIES: '1'
  REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
  ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
  THROTTLE_BURST: ${THROTTLE_BURST:-20/second}
  THROTTLE_SUSTAINED: ${THROTTLE_SUSTAINED:-2000/hour}
  EMAIL_URL: ${EMAIL_URL:-smtp://mailpit:1025}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Innotrec <noreply@example.com>}
  DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
  DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}

x-spa-args: &spa-args
  VITE_API_URL: /api
  VITE_APP_NAME: ${APP_NAME:-Innotrec Sample}
  VITE_DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
  VITE_REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-innotrec}
      POSTGRES_USER: ${POSTGRES_USER:-innotrec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [data]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
    networks: [data]

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [data, web]

  frontend:
    build:
      context: ..
      dockerfile: deploy/spa.Dockerfile
      args:
        <<: *spa-args
        WORKSPACE: frontend
        BASE_PATH: /
    restart: unless-stopped
    networks: [web]

  doc:
    build:
      context: ..
      dockerfile: deploy/spa.Dockerfile
      args:
        <<: *spa-args
        WORKSPACE: doc
        BASE_PATH: /doc/
    restart: unless-stopped
    networks: [web]

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-8080}:80'
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_started }
      doc: { condition: service_started }
    networks: [web]

  # Development / staging only: catches every e-mail, web UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    profiles: [dev]
    ports:
      - '${MAILPIT_PORT:-8025}:8025'
    networks: [data, web]

networks:
  # database + cache: no route to the outside world
  data:
    internal: true
  web: {}

volumes:
  pgdata: {}
