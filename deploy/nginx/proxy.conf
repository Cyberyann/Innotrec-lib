# Public entry point: the only container exposed to the outside world.
#   /api/*            -> Django (gunicorn)          rate-limited
#   /django-admin/*   -> Django admin               rate-limited
#   /doc/*            -> documentation SPA
#   /*                -> application SPA
# Put a TLS terminator (Traefik, Caddy, cloud LB...) in front, or add a "listen 443 ssl" server here.

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status 429;
limit_conn_status 429;

upstream backend { server backend:8000; keepalive 16; }
upstream frontend { server frontend:8080; }
upstream doc { server doc:8080; }

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;
    limit_conn perip 50;

    # ---------------------------------------------------------------- security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ---------------------------------------------------------------- proxy defaults
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    # Edge proxy: overwrite (never append) so clients cannot spoof their IP for rate limiting
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 60s;

    # ---------------------------------------------------------------- API
    location /api/auth/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://backend;
    }
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://backend;
    }
    location /django-admin/ {
        limit_req zone=auth burst=20 nodelay;
        # Restrict the admin to trusted networks in production, e.g.:
        # allow 10.0.0.0/8; deny all;
        proxy_pass http://backend;
    }
    location /django-static/ {
        proxy_pass http://backend;
    }

    # ---------------------------------------------------------------- SPAs
    location = /doc { return 301 /doc/; }
    location /doc/ {
        proxy_pass http://doc;
    }
    location / {
        proxy_pass http://frontend;
    }
}
