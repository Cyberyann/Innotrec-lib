version: 2
updates:
  - package-ecosystem: pip
    directories: ['/backend_lib', '/backend']
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: '/'
    schedule: { interval: weekly }
    groups:
      react: { patterns: ['react', 'react-dom', '@types/react*', 'react-router'] }
      tooling:
        {
          patterns:
            ['vite', 'vitest', '@vitest/*', '@vitejs/*', 'eslint*', 'typescript*', 'prettier'],
        }
  - package-ecosystem: docker
    directories: ['/backend', '/deploy']
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: '/'
    schedule: { interval: weekly }
